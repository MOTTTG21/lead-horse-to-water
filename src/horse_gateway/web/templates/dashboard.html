<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barn observability</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <h1>📊 Barn observability</h1>
      <nav><a href="/" class="tab">Back to game</a></nav>
    </header>
    <main>
      <section class="panel active">
        <div id="alerts"></div>
        <div class="stat-grid">
          <div class="stat"><span id="stat-total-calls">-</span><label>total tool calls</label></div>
          <div class="stat"><span id="stat-deny-rate">-</span><label>deny rate</label></div>
          <div class="stat highlight"><span id="stat-loop-rate">-</span><label>initiator=llm_agent_loop rate</label></div>
          <div class="stat"><span id="stat-social-denials">-</span><label>denied post_to_stable_social attempts</label></div>
          <div class="stat"><span id="stat-llm-calls">-</span><label>total LLM calls</label></div>
          <div class="stat"><span id="stat-cost">-</span><label>estimated LLM cost (USD)</label></div>
        </div>
        <p class="hint">Refreshes every 10 seconds. See <code>docs/runbook.md</code> for what each signal means if it pages.</p>
      </section>
    </main>
  </div>
  <script src="/static/dashboard.js"></script>
</body>
</html>
